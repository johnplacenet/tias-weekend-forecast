<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Find out who your perfect date is.">
  <meta name="theme-color" content="#ff8fab">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="The Perfect Date">
  <meta property="og:description" content="Find out who your perfect date is.">
  <meta property="og:url" content="https://date.thecre8iveplace.com/f/tia">
  <link rel="canonical" href="https://date.thecre8iveplace.com/f/tia">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff8fab'/%3E%3Ccircle cx='32' cy='28' r='12' fill='%23ffd93d'/%3E%3Cpath d='M10 50c8-8 14-8 22 0s14 8 22 0' fill='none' stroke='%232ec4b6' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>The Perfect Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Easy color edits */
    :root {
      --coral: #ff6b6b;
      --coral-deep: #ef3d66;
      --coral-ink: #c2184e;
      --sun: #ffd93d;
      --sun-deep: #f0b429;
      --aqua: #2ec4b6;
      --aqua-deep: #0f8f86;
      --lavender: #c4b5fd;
      --lavender-deep: #7c5cbf;
      --pink: #ff8fab;
      --pink-deep: #ff5d8f;
      --ink: #2b2140;
      --ink-soft: #5e5472;
      --paper: rgba(255, 252, 250, 0.94);
      --edge: rgba(43, 33, 64, 0.08);
      --shadow: 0 22px 50px rgba(73, 28, 78, 0.16);
      --font: Fredoka, "Avenir Next", "Avenir Next Rounded", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 18px;
      line-height: 1.45;
      color: var(--ink);
      background: linear-gradient(165deg, #8fd8ff 0%, #d9c6ff 34%, #ffd0e4 62%, #ffe38a 100%);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    p, h1, h2, h3 { margin-top: 0; }

    :focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
      box-shadow: 0 0 0 6px var(--ink);
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .sun-wrap {
      position: absolute;
      top: 18px;
      right: 4%;
      width: 150px;
      height: 150px;
    }

    .rays {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(255, 217, 61, 0.95) 0 7deg, transparent 7deg 20deg);
      -webkit-mask: radial-gradient(circle, transparent 0 48%, #000 52%);
      mask: radial-gradient(circle, transparent 0 48%, #000 52%);
      animation: spin 36s linear infinite;
    }

    .sun {
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, var(--sun) 46%, #ffb703 100%);
      box-shadow: 0 0 30px rgba(255, 183, 3, 0.7);
    }

    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 40px;
      opacity: 0.92;
      animation: drift 32s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .c1 { width: 120px; height: 42px; top: 12%; left: -8%; }
    .c1::before { width: 46px; height: 46px; top: -24px; left: 18px; }
    .c1::after { width: 64px; height: 64px; top: -34px; left: 46px; }
    .c2 { width: 150px; height: 48px; top: 22%; right: -12%; animation-duration: 42s; animation-direction: reverse; }
    .c2::before { width: 54px; height: 54px; top: -28px; left: 24px; }
    .c2::after { width: 78px; height: 78px; top: -42px; left: 58px; }
    .c3 { width: 90px; height: 34px; bottom: 18%; left: 6%; animation-duration: 38s; }
    .c3::before { width: 36px; height: 36px; top: -18px; left: 14px; }
    .c3::after { width: 48px; height: 48px; top: -26px; left: 36px; }
    .c4 { width: 110px; height: 38px; bottom: 8%; right: 8%; animation-duration: 46s; animation-direction: reverse; }
    .c4::before { width: 40px; height: 40px; top: -20px; left: 16px; }
    .c4::after { width: 58px; height: 58px; top: -30px; left: 42px; }

    .rainbow {
      position: absolute;
      left: -10%;
      bottom: -20px;
      width: 120%;
      height: auto;
      opacity: 0.55;
    }

    .bolt {
      position: absolute;
      width: 28px;
      height: 46px;
      opacity: 0.8;
    }

    .b1 { top: 16%; left: 8%; }
    .b2 { bottom: 22%; right: 18%; width: 22px; height: 36px; opacity: 0.55; }

    .stage {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 32px;
    }

    .panel {
      background: var(--paper);
      border-radius: 32px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      padding: 28px 22px 22px;
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      display: table;
      margin: 0 auto 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      color: var(--coral-ink);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(2.5rem, 11vw, 4.6rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .tagline {
      text-align: center;
      font-size: clamp(1.2rem, 4vw, 1.45rem);
      margin: 0 0 18px;
    }

    .tia-frame {
      position: relative;
      width: min(250px, 68vw);
      margin: 0 auto 14px;
      aspect-ratio: 1;
    }

    .tia-frame .sun-wrap {
      left: auto;
      right: -16px;
      top: -14px;
      width: 96px;
      height: 96px;
      z-index: 0;
    }

    .tia-frame .sun { inset: 24px; }

    .tia-frame img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      border-radius: 32px;
      border: 5px solid #fff;
      box-shadow: 0 16px 30px rgba(43, 33, 64, 0.2);
      background: #ffe8d6;
      transition: opacity 0.35s ease;
    }

    .tia-frame img.is-out { opacity: 0; }

    .hero-art {
      position: relative;
      height: 132px;
      margin: 4px 0 8px;
    }

    .hero-art .sun-wrap { right: auto; left: 50%; top: 0; transform: translateX(-50%); width: 120px; height: 120px; }
    .hero-art .sun { inset: 28px; }
    .hero-cloud {
      position: absolute;
      left: 12%;
      bottom: 18px;
      width: 78px;
      height: 28px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 28px -16px 0 8px #fff, 58px -6px 0 2px #fff;
    }

    .preview-steps {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      list-style: none;
      padding: 0;
      margin: 0 0 18px;
    }

    .preview-steps li {
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 3px solid transparent;
    }

    .preview-steps li:nth-child(1) { border-color: var(--coral); }
    .preview-steps li:nth-child(2) { border-color: var(--lavender-deep); }
    .preview-steps li:nth-child(3) { border-color: var(--aqua); }

    .fine {
      text-align: center;
      color: var(--ink-soft);
      margin: 14px 0 0;
      font-size: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.2;
      text-align: center;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 6px 0 var(--btn-edge);
    }

    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-edge); }
    .btn:disabled { cursor: default; }

    .btn-coral { --btn-edge: #c2184e; background: linear-gradient(180deg, #ff8d9a, var(--coral-deep)); }
    .btn-aqua { --btn-edge: #0b6e68; background: linear-gradient(180deg, #63e4d8, var(--aqua-deep)); }
    .btn-lavender { --btn-edge: #5b32b3; background: linear-gradient(180deg, #d5c4ff, #6d46d4); }
    .btn-ghost {
      --btn-edge: #e4d8f3;
      background: #fff;
      color: var(--ink);
    }

    .step-count {
      margin: 0 0 10px;
      text-align: center;
      font-weight: 700;
      color: var(--coral-ink);
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      list-style: none;
      padding: 0;
      margin: 0 0 18px;
    }

    .progress-item {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink-soft);
    }

    .progress-item span {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      margin: 0 auto 6px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #eadff8;
      color: var(--ink);
      font-size: 1rem;
    }

    .progress-item.is-current { color: var(--ink); }
    .progress-item.is-current span { background: var(--coral-deep); border-color: var(--coral-ink); color: #fff; }
    .progress-item.is-done span { background: var(--aqua-deep); border-color: #0b6e68; color: #fff; }

    .step-title {
      margin: 0 0 6px;
      font-size: clamp(2rem, 6vw, 2.6rem);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .lede, .hint { color: var(--ink-soft); margin: 0 0 14px; }
    .hint { margin: -4px 0 10px; font-size: 1rem; }

    .block { margin: 0 0 20px; }
    .block h3 { margin: 0 0 8px; font-size: 1.2rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 10px; }

    .chip, .choice {
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      border: 3px solid #eadff8;
      min-height: 48px;
      padding: 10px 14px;
      font-weight: 700;
      box-shadow: 0 4px 0 var(--edge);
      max-width: 100%;
      min-width: 0;
      white-space: normal;
      text-align: center;
    }

    .chip:nth-child(5n + 1) { border-color: var(--coral); }
    .chip:nth-child(5n + 2) { border-color: var(--sun-deep); }
    .chip:nth-child(5n + 3) { border-color: var(--aqua); }
    .chip:nth-child(5n + 4) { border-color: var(--lavender-deep); }
    .chip:nth-child(5n + 5) { border-color: var(--pink-deep); }

    .chip[aria-pressed="true"],
    .choice[aria-pressed="true"] {
      background: linear-gradient(180deg, #fff6c4, var(--sun));
      border-color: var(--sun-deep);
      box-shadow: 0 5px 0 var(--sun-deep);
    }

    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .choice {
      position: relative;
      text-align: left;
      border-radius: 22px;
      min-height: 96px;
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
    }

    .choice[aria-pressed="true"]::after {
      content: "";
      position: absolute;
      top: 12px;
      right: 14px;
      width: 8px;
      height: 14px;
      border: solid var(--coral-ink);
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .choice-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #fff1f5;
    }

    .choice-icon svg { width: 30px; height: 30px; display: block; }
    .choice-label { font-size: 1rem; line-height: 1.2; }

    .readout {
      margin: 0 0 8px;
      font-weight: 700;
      font-size: 1.25rem;
    }

    .wish {
      width: 100%;
      min-height: 128px;
      border: 3px solid #eadff8;
      border-radius: 22px;
      padding: 14px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      resize: vertical;
    }

    .slider-label { display: block; margin: 10px 0 6px; font-weight: 700; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      border-radius: 999px;
      background: #efe7fb;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--coral-deep);
      box-shadow: 0 2px 0 rgba(43, 33, 64, 0.12);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--coral-deep);
      cursor: pointer;
    }

    .ticks {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .quiz-nav { display: grid; gap: 10px; margin-top: 8px; }

    #screen-search {
      min-height: min(70vh, 640px);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    #screen-search:not([hidden]) {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .radar-label {
      margin: 0 0 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--aqua-deep);
      font-size: 0.95rem;
    }

    .radar {
      width: min(240px, 68vw);
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle, rgba(184, 255, 231, 0.95) 0 6px, transparent 7px),
        repeating-radial-gradient(circle, transparent 0 28px, rgba(184, 255, 231, 0.45) 29px 31px),
        #07323a;
      box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.45), 0 16px 40px rgba(7, 50, 58, 0.25);
    }

    .radar-sweep {
      position: absolute;
      inset: 0;
      background: conic-gradient(from 0deg, transparent 0 70%, rgba(184, 255, 231, 0.9) 88%, transparent 100%);
      animation: spin 1.7s linear infinite;
    }

    .blip {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d9fff4;
      box-shadow: 0 0 10px #d9fff4;
      animation: blink 1.4s ease-in-out infinite;
    }

    .storm .radar {
      background:
        radial-gradient(circle, rgba(255, 180, 200, 0.95) 0 6px, transparent 7px),
        repeating-radial-gradient(circle, transparent 0 28px, rgba(255, 180, 200, 0.35) 29px 31px),
        #3a1430;
      box-shadow: 0 0 0 8px rgba(255, 180, 200, 0.35), 0 16px 40px rgba(40, 10, 30, 0.28);
    }

    .storm .radar-sweep {
      background: conic-gradient(from 0deg, transparent 0 64%, rgba(255, 120, 160, 0.95) 86%, transparent 100%);
      animation-duration: 0.75s;
    }

    .storm .blip { background: #ffd0e0; box-shadow: 0 0 10px #ffd0e0; }
    .storm .radar-label { color: var(--coral-ink); }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    .storm .flash { animation: zap 1.15s steps(2, end) infinite; }

    .search-message {
      min-height: 4.6em;
      margin: 20px 0 0;
      font-size: clamp(1.4rem, 4.4vw, 2rem);
      line-height: 1.25;
      text-wrap: balance;
    }

    .search-message.is-punch { font-size: clamp(1.6rem, 5vw, 2.3rem); }

    .search-progress {
      width: min(280px, 80%);
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      overflow: hidden;
      margin-top: 8px;
    }

    #searchProgress {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--coral-deep), var(--sun));
      transition: width 0.35s ease;
    }

    .photo-slot { margin: 0 0 14px; }
    .photo-slot img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 460px;
      object-fit: cover;
      border-radius: 22px;
      box-shadow: 0 14px 30px rgba(43, 33, 64, 0.18);
      animation: name-pop 0.45s cubic-bezier(0.2, 0.85, 0.2, 1);
    }

    .kicker {
      margin: 0 0 8px;
      text-align: center;
      color: var(--coral-ink);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .name {
      margin: 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.95;
      font-size: clamp(2.15rem, 8vw, 4.1rem);
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    .name.long {
      font-size: clamp(1.55rem, 5.6vw, 2.6rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .name.stack span {
      display: block;
      font-size: clamp(3rem, 14vw, 5.3rem);
      line-height: 0.88;
    }

    .forecast-line {
      text-align: center;
      font-size: 1.22rem;
      margin: 12px 0 0;
      text-wrap: balance;
    }

    .forecast-soft { opacity: 0.82; font-size: 1.05rem; }

    .meter { margin-top: 16px; }
    .meter-top { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; margin-bottom: 6px; }
    .meter-track { height: 16px; border-radius: 999px; background: rgba(43, 33, 64, 0.12); overflow: hidden; }
    .meter-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--coral-deep), var(--sun));
      transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .note {
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      border-radius: 18px;
      padding: 12px 14px;
      margin-top: 14px;
      text-align: left;
    }

    .note-label {
      margin: 0 0 4px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--lavender-deep);
    }

    .note-copy { margin: 0; }

    .actions { display: grid; gap: 12px; margin-top: 18px; }

    .hero-sun, .theme-premiere .hero-sun {
      width: 74px;
      height: 74px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, var(--sun) 50%, #ffb703);
      box-shadow: 0 0 0 10px rgba(255, 217, 61, 0.35);
    }

    .hero-art .hero-sun { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); margin: 0; }

    .hazard-bar {
      height: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: repeating-linear-gradient(90deg, #2b2140 0 14px, var(--sun) 14px 28px);
    }

    .heat-flag, .on-air, .live-pill {
      display: table;
      margin: 0 auto 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--coral-deep);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .on-air { background: #0f6e9b; }

    .swirl, .mini-radar {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
    }

    .swirl {
      background:
        radial-gradient(circle, #dff9ff 0 16%, transparent 17%),
        repeating-conic-gradient(from 0deg, #127489 0 12deg, #e7fbff 12deg 20deg);
      animation: spin 3.5s linear infinite;
    }

    .mini-radar {
      background:
        radial-gradient(circle, rgba(184, 255, 231, 0.95) 0 5px, transparent 6px),
        repeating-radial-gradient(circle, transparent 0 14px, rgba(184, 255, 231, 0.4) 15px 16px),
        #062a32;
    }

    .crown { width: 84px; margin: 0 auto 6px; }
    .crown svg { width: 100%; height: auto; display: block; }

    .seal {
      width: 108px;
      height: 108px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 40% 35%, #fff6c8, #f0b429 55%, #d88912);
      color: #6a3b00;
      box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.8), 0 0 0 12px #f0b429;
      font-weight: 700;
      letter-spacing: 0.08em;

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function wait(ms) {
      return new Promise((resolve) => {
        window.setTimeout(resolve, ms);
      });
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        const held = copy[index];
        copy[index] = copy[swap];
        copy[swap] = held;
      }
      return copy;
    }

    function refillDeck() {
      deck = shuffle(RESULTS.slice(1));
      if (deck.length > 1 && deck[0].id === lastResultId) {
        const swap = 1 + Math.floor(Math.random() * (deck.length - 1));
        const held = deck[0];
        deck[0] = deck[swap];
        deck[swap] = held;
      }
      deckIndex = 0;
    }

    function takeResult() {
      if (firstPending) {
        firstPending = false;
        lastResultId = RESULTS[0].id;
        return RESULTS[0];
      }
      if (deckIndex >= deck.length) refillDeck();
      const result = deck[deckIndex];
      deckIndex += 1;
      lastResultId = result.id;
      return result;
    }

    function laterTrio() {
      const trio = [0, 1, 2].map((offset) => {
        return LATER_SEARCH_MESSAGES[(laterCursor + offset) % LATER_SEARCH_MESSAGES.length];
      });
      laterCursor = (laterCursor + 3) % LATER_SEARCH_MESSAGES.length;
      return trio;
    }

    function pickJoke() {
      const jokes = Array.from(document.querySelectorAll("[data-joke][aria-pressed='true']")).map((button) => button.dataset.joke);
      if (ageTouched) jokes.push(AGE_JOKE);
      if (travelTouched) {
        const travel = document.getElementById("travelRange");
        jokes.push(TRAVEL_STOPS[Number(travel.value)].joke);
      }
      const pool = jokes.length ? jokes : [NO_PREFERENCE_JOKE];
      const joke = pool[jokeCursor % pool.length];
      jokeCursor += 1;
      return joke;
    }

        .replaceAll("JOHN PLACE", person.fullUp)
        .replaceAll("John Place", person.full)
        .replaceAll("John", person.first);

    function setPerson(full) {
      const clean = String(full || "John Place").trim().replace(/\s+/g, " ");
      const bits = clean.split(" ");
      const first = bits.length > 1 ? bits.slice(0, -1).join(" ") : bits[0];
      const last = bits.length > 1 ? bits[bits.length - 1] : first;
      currentPerson = {
        full: clean,
        first,
        last,
        fullUp: clean.toUpperCase(),
        firstUp: first.toUpperCase(),
        lastUp: last.toUpperCase()
      };
    }

      return /s$/i.test(name) ? `${name}'` : `${name}'s`;

      if (title) title.textContent = heading;

    function renderResult(result, joke) {
      const layout = LAYOUTS[result.layout] || LAYOUTS.standard;

    let audioCtx = null;
    let masterGain = null;
    let photoDeck = [];
    let photoCursor = 0;
    let lastPhotoSrc = "";
    let tiaDeck = [];
    let tiaCursor = 0;
    let lastTiaSrc = "";
    let tiaTimer = 0;
    let tiaSwapToken = 0;
    let tiaRequest = 0;
    let tiaFailures = 0;

    function nextFromDeck(list, deck, cursor, lastSrc) {
      if (!list.length) return { photo: null, deck, cursor, lastSrc };
      if (cursor >= deck.length) {
        deck = shuffle(list);
        if (deck.length > 1 && deck[0].src === lastSrc) {
          const swap = 1 + Math.floor(Math.random() * (deck.length - 1));
          const held = deck[0];
          deck[0] = deck[swap];
          deck[swap] = held;
        }
        cursor = 0;
      }
      const photo = deck[cursor];
      return { photo, deck, cursor: cursor + 1, lastSrc: photo.src };
    }

    function nextPhoto() {
      if (forecastSlug !== "tia") return null;
      const next = nextFromDeck(PHOTOS, photoDeck, photoCursor, lastPhotoSrc);
      photoDeck = next.deck;
      photoCursor = next.cursor;
      lastPhotoSrc = next.lastSrc;
      return next.photo;
    }

    function nextTiaPhoto() {
      const next = nextFromDeck(recipientList, tiaDeck, tiaCursor, lastTiaSrc);
      tiaDeck = next.deck;
      tiaCursor = next.cursor;
      lastTiaSrc = next.lastSrc;
      return next.photo;
    }

    function showTiaFrame() {
      const frame = document.getElementById("tiaFrame");
      const hero = document.getElementById("heroArt");
      if (frame) frame.hidden = false;
      if (hero) hero.hidden = true;
    }

    function showTiaFallback() {
      const frame = document.getElementById("tiaFrame");
      const hero = document.getElementById("heroArt");
      stopTiaRotation();
      if (frame) frame.hidden = true;
      if (hero) hero.hidden = false;
    }

    function watchTia(image, photo) {
      const request = ++tiaRequest;
      image.onload = () => {
        if (request !== tiaRequest || image.naturalWidth <= 0) return;
        tiaFailures = 0;
        showTiaFrame();
      };
      image.onerror = () => {
        if (request !== tiaRequest) return;
        tiaFailures += 1;
        if (tiaFailures >= recipientList.length) {
          showTiaFallback();
          return;
        }
        const next = nextTiaPhoto();
        if (next) paintTia(next, false);
      };
      image.style.objectPosition = photo.focus || "center 30%";
      if (image.getAttribute("src") !== photo.src) image.src = photo.src;
      else if (image.complete && image.naturalWidth > 0) showTiaFrame();
    }

    function paintTia(photo, animate) {
      const image = document.getElementById("tiaPhoto");
      if (!image || !photo) return;
      const token = ++tiaSwapToken;
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const apply = () => {
        if (token !== tiaSwapToken) return;
        image.classList.remove("is-out");
        watchTia(image, photo);
      };
      if (!animate || reduced) {
        apply();
        return;
      }
      image.classList.add("is-out");
      window.setTimeout(apply, 320);
    }

    function stopTiaRotation() {
      if (tiaTimer) window.clearInterval(tiaTimer);
      tiaTimer = 0;
    }

    function startTiaRotation() {
      stopTiaRotation();
      if (recipientList.length < 2) return;
      tiaTimer = window.setInterval(() => {
        const open = document.getElementById("screen-open");
        if (!open || open.hidden) return;
        const photo = nextTiaPhoto();
        if (photo) paintTia(photo, true);
      }, TIA_ROTATE_MS);
    }

    function bindTiaPhoto() {
      const image = document.getElementById("tiaPhoto");
      const frame = document.getElementById("tiaFrame");
      const hero = document.getElementById("heroArt");
      if (!image || !frame) return;
      if (!recipientList.length) {
        frame.hidden = true;
        if (hero) hero.hidden = false;
        return;
      }
      lastTiaSrc = image.getAttribute("src") || "";
      const opening = recipientList.find((photo) => photo.src === lastTiaSrc) || recipientList[0];
      watchTia(image, opening);
      startTiaRotation();
    }

    function mountPhoto(root) {
      const slot = root.querySelector(".photo-slot");
      if (!slot) return;
      slot.hidden = true;
      slot.replaceChildren();
      const photo = nextRevealPhoto || nextPhoto();
      nextRevealPhoto = null;
      if (!photo || !photo.src) return;
      const image = document.createElement("img");
      image.alt = photo.alt || currentPerson.full;
      image.draggable = false;
      image.style.objectPosition = photo.focus || "center";
      image.addEventListener("load", () => {
        if (photo.generated && image.naturalWidth > image.naturalHeight) {
          image.style.aspectRatio = "4 / 3";
        }
        slot.hidden = image.naturalWidth <= 0;
      });
      image.addEventListener("error", () => {
        slot.hidden = true;
        slot.replaceChildren();
      });
      slot.appendChild(image);
      image.src = photo.src;
    }

    function unlockAudio() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtx) {
          audioCtx = new AudioCtx();
          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.value = -8;
          compressor.knee.value = 6;
          compressor.ratio.value = 5;
          compressor.attack.value = 0.002;
          compressor.release.value = 0.16;
          masterGain = audioCtx.createGain();
          masterGain.gain.value = MASTER_VOLUME;
          masterGain.connect(compressor);
          compressor.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (error) {
        audioCtx = null;
      }
    }

    function envGain(peak, dur, delay) {
      const start = audioCtx.currentTime + (delay || 0);
      const amp = audioCtx.createGain();
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.exponentialRampToValueAtTime(Math.max(peak, 0.001), start + Math.min(0.025, dur * 0.25));
      amp.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      amp.connect(masterGain);
      return { amp, start };
    }

    function beep(freq, dur, type, peak, delay, endFreq) {
      if (!audioCtx) return;
      const { amp, start } = envGain(peak, dur, delay);
      const osc = audioCtx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(35, endFreq), start + dur);
      osc.connect(amp);
      osc.start(start);
      osc.stop(start + dur + 0.03);
    }

    function burst(dur, peak, delay, freq, kind) {
      if (!audioCtx) return;
      const { amp, start } = envGain(peak, dur, delay);
      const length = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
      const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let index = 0; index < length; index += 1) data[index] = Math.random() * 2 - 1;
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = kind || "lowpass";
      filter.frequency.setValueAtTime(freq, start);
      source.connect(filter);
      filter.connect(amp);
      source.start(start);
      source.stop(start + dur + 0.02);
    }

      const layer = document.getElementById("confetti");
      const colors = ["#ff6b6b", "#ffd93d", "#2ec4b6", "#c4b5fd", "#ff8fab", "#fff"];

    async function spinSlots(root) {
      const strips = Array.from(root.querySelectorAll(".reel-strip"));
      if (!strips.length || prefersReducedMotion()) return;
      playCue("ratchet");
      strips.forEach((strip, index) => {
        const itemHeight = strip.children[0] ? strip.children[0].getBoundingClientRect().height : 64;
        const distance = (strip.children.length - 1) * (itemHeight || 64);
        strip.style.transition = "none";
        strip.style.transform = "translateY(0)";
        strip.getBoundingClientRect();
        strip.style.transition = `transform ${1.15 + index * 0.28}s cubic-bezier(.12,.7,.12,1)`;
        strip.style.transform = `translateY(-${distance}px)`;
      });
      await wait(1150 + 2 * 280 + 180);
    }

    async function flipBoard(root) {
      const tiles = Array.from(root.querySelectorAll(".tile"));
      if (prefersReducedMotion()) {
        tiles.forEach((tile) => tile.classList.add("show"));
        return;
      }
      for (let index = 0; index < tiles.length; index += 1) {
        tiles[index].classList.add("show");
        await wait(70);

    }

    async function present(result, joke) {
      Array.from(resultPanel.classList).forEach((className) => {
        if (className.startsWith("theme-")) resultPanel.classList.remove(className);
      });
      resultPanel.classList.remove("is-revealed");
      resultPanel.classList.add(`theme-${result.theme}`);
      showScreen("screen-result");
      scrollTop();

      if (result.layout === "fakeout") {
        resultBody.innerHTML = `<h2 class="name long fake-name" tabindex="-1">${escapeHTML(say(result.fakeName))}</h2>`;
        focusHeading(resultBody);
        playCue("wrong");
        await wait(1500);
        resultPanel.classList.add("is-revealed");
        resultBody.innerHTML = resultMarkup(nameHTML(result.name), result.lines, joke);
      } else {
        resultBody.innerHTML = renderResult(result, joke);
      }

      if (result.layout === "slot") await spinSlots(resultBody);
      if (result.layout === "letterboard") await flipBoard(resultBody);
      mountPhoto(resultBody);
      animateMeter(resultBody);
      burstConfetti();
      playReveal(result);
      focusHeading(resultBody);
      disclaimer.hidden = false;
    }

    async function playSequence(messages, stepMs, pauseMs) {
      const pauseAt = messages.length - 2;
      const storm = searchScreen.classList.contains("storm");
      for (let index = 0; index < messages.length; index += 1) {
        const text = messages[index];
        setSearchMessage(text);
        searchProgress.style.width = `${((index + 1) / messages.length) * 100}%`;
        if (text === RESPECT_LINE) playCue("scratch");
        else if (text === ATMOSPHERE_LINE) playCue("wah");
        else playCue(storm ? "stormping" : "ping");
        const usePause = pauseMs && index >= pauseAt;
        await wait(usePause ? pauseMs : stepMs);
      }
    }

    function collectAnswers() {
      const selected = Array.from(document.querySelectorAll("[aria-pressed='true']")).map((button) => button.textContent.trim());
      const age = document.getElementById("ageReadout");
      const travel = document.getElementById("travelReadout");
      return {
        selected,
        age: ageTouched && age ? age.textContent : "",
        travel: travelTouched && travel ? travel.textContent : "",
        wish: (document.getElementById("perfectNote")?.value || "").trim().slice(0, 400)
      };
    }

    function startReveal() {
      revealTask = fetch("/api/reveal", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ slug: forecastSlug, account: forecastAccount, answers: collectAnswers() })
      }).then((response) => response.ok ? response.json() : null).catch(() => null);
    }

    async function waitForReveal() {
      const extra = ["Painting your weekend", "Matching a face to the forecast", "Clearing the last clouds"];
      let step = 0;
      const deadline = Date.now() + 22000;
      while (Date.now() < deadline) {
        const winner = await Promise.race([
          revealTask.then((value) => ({ value })),
          wait(1500).then(() => ({ value: undefined }))
        ]);
        if (winner.value !== undefined) return winner.value;
        setSearchMessage(extra[step % extra.length]);
        searchProgress.style.width = "100%";
        playCue("ping");
        step += 1;
      }
      return null;
    }

    let revealTask = null;

    async function runForecast(mode) {
      if (busy) return;
      unlockAudio();
      busy = true;
      syncBusy();
      startReveal();
      try {
        showScreen("screen-search");
        searchScreen.classList.toggle("storm", mode === "else");
        searchProgress.style.width = "0%";
        searchMessage.focus();
        let messages;
        let stepMs = 1000;
        let pauseMs = 0;
        if (mode === "else") {
          messages = ANYONE_ELSE_MESSAGES.concat([RESPECT_LINE, ATMOSPHERE_LINE]);
          stepMs = 850;
          pauseMs = 1300;
        } else if (searchesStarted === 0) {
          messages = FIRST_SEARCH_MESSAGES;
        } else {
          messages = laterTrio();
        }
        await playSequence(messages, stepMs, pauseMs);
        const reveal = await waitForReveal();
        if (reveal && reveal.senderName) setPerson(reveal.senderName);
        else if (forecastSlug !== "tia") setPerson("Your date");
        if (reveal && reveal.photo && reveal.photo.src) nextRevealPhoto = reveal.photo;
        searchScreen.classList.remove("storm");
        const joke = pickJoke();
        const result = takeResult();
        await present(result, joke);
        mountContact(reveal && reveal.senderName, reveal && reveal.contact);
        searchesStarted += 1;
      } finally {
        busy = false;
        syncBusy();
      }
    }

    function smsHref(phone, message) {
      const digits = String(phone || "").replace(/\D/g, "");
      let number = "";
      if (digits.length === 10) number = `+1${digits}`;
      else if (digits.length === 11 && digits.startsWith("1")) number = `+${digits}`;
      else if (digits.length > 11) number = `+${digits}`;
      if (!number) return "";
      return `sms:${number}?&body=${encodeURIComponent(message)}`;
    }

    function mountContact(name, contact) {
      const previous = document.getElementById("contactActions");
      if (previous) previous.remove();
      if (!contact) return;
      const first = String(name || "them").trim().split(/\s+/)[0] || "them";
      const note = "I finished The Perfect Date. It's you.";
      const bar = document.createElement("div");
      bar.id = "contactActions";
      bar.className = "actions";
      const phoneLink = smsHref(contact.phone, note);
      if (phoneLink) {
        const text = document.createElement("a");
        text.className = "btn btn-coral";
        text.href = phoneLink;
        text.textContent = `Text ${first}`;
        bar.append(text);
      }
      if (/^[^\s@]+@[^\s@]+$/.test(contact.email || "")) {
        const mail = document.createElement("a");
        mail.className = "btn btn-aqua";
        mail.href = `mailto:${contact.email}?subject=${encodeURIComponent("The Perfect Date")}&body=${encodeURIComponent(note)}`;
        mail.textContent = `Email ${first}`;
        bar.append(mail);
      }
      if (!bar.childElementCount) return;
      resultPanel.querySelector(".actions").before(bar);
    }

    function syncBusy() {
      document.body.classList.toggle("is-busy", busy);
      [startBtn, nextBtn, backBtn, againBtn, editBtn, elseBtn].forEach((button) => {
        button.disabled = busy;
      });
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.hidden = screen.id !== id;
      });
      if (id === "screen-open") {
        const heading = document.querySelector("#screen-open h1");
        if (heading) heading.focus();
        const photo = nextTiaPhoto();
        if (photo) paintTia(photo, false);
        startTiaRotation();
      } else {
        stopTiaRotation();
      }
    }

    function showStep(index) {
      stepIndex = index;
      document.querySelectorAll(".step").forEach((panel, panelIndex) => {
        panel.hidden = panelIndex !== index;
      });
      document.getElementById("stepCount").textContent = `Step ${index + 1} of 3`;
      nextBtn.textContent = index === STEPS.length - 1 ? "Reveal My Perfect Date" : "Next";
      document.querySelectorAll(".progress-item").forEach((item, itemIndex) => {
        item.classList.toggle("is-current", itemIndex === index);
        item.classList.toggle("is-done", itemIndex < index);
        if (itemIndex === index) item.setAttribute("aria-current", "step");
        else item.removeAttribute("aria-current");
      });
      const heading = document.querySelectorAll(".step")[index].querySelector("h2");
      if (heading) heading.focus();
      scrollTop();
    }

    function toggleChoice(button, mode, group) {
      const wasOn = button.getAttribute("aria-pressed") === "true";
      if (mode === "single") {
        group.querySelectorAll("button").forEach((item) => item.setAttribute("aria-pressed", "false"));
      }
      button.setAttribute("aria-pressed", wasOn ? "false" : "true");
    }

    function renderChoices(block) {
      const wrap = document.createElement("section");
      wrap.className = "block";
      const title = document.createElement("h3");
      title.id = `label-${block.group}`;
      title.textContent = block.title;
      wrap.append(title);
      if (block.hint) {
        const hint = document.createElement("p");
        hint.className = "hint";
        hint.textContent = block.hint;
        wrap.append(hint);
      }
      const group = document.createElement("div");
      group.className = block.style === "cards" ? "choice-grid" : "chips";
      group.setAttribute("role", "group");
      group.setAttribute("aria-labelledby", title.id);
      block.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = block.style === "cards" ? "choice" : "chip";
        button.dataset.joke = option.joke;
        button.setAttribute("aria-pressed", "false");
        if (block.style === "cards" && ICONS[option.id]) {
          const icon = document.createElement("span");
          icon.className = "choice-icon";
          icon.innerHTML = ICONS[option.id];
          button.append(icon);
        }
        const label = document.createElement("span");
        label.className = "choice-label";
        label.textContent = option.label;
        button.append(label);
        button.addEventListener("click", () => toggleChoice(button, block.mode, group));
        group.append(button);
      });
      wrap.append(group);
      return wrap;
    }

    function renderAge() {
      const wrap = document.createElement("section");
      wrap.className = "block";
      wrap.innerHTML = `
        <h3 id="label-age">Age range</h3>
        <p class="hint">Adults only, 18 and up.</p>
        <p id="ageReadout" class="readout">Ages 25 to 40</p>
        <label class="slider-label" for="ageMin">Youngest</label>
        <input id="ageMin" type="range" min="18" max="80" value="25" aria-describedby="label-age">
        <label class="slider-label" for="ageMax">Oldest</label>
        <input id="ageMax" type="range" min="18" max="80" value="40" aria-describedby="label-age">`;
      return wrap;
    }

    function renderTravel() {
      const wrap = document.createElement("section");
      wrap.className = "block";
      wrap.innerHTML = `
        <h3 id="label-travel">How far would you travel for a date</h3>
        <p class="hint">Slide it, or leave the suggestion.</p>
        <p id="travelReadout" class="readout">About 30 minutes</p>
        <input id="travelRange" type="range" min="0" max="3" step="1" value="1" aria-labelledby="label-travel">
        <div class="ticks" aria-hidden="true"><span>Across town</span><span>30 min</span><span>1 hour</span><span>Wherever</span></div>`;
      return wrap;
    }

    function paintRange(input) {
      const min = Number(input.min);
      const max = Number(input.max);
      const percent = ((Number(input.value) - min) / (max - min)) * 100;
      input.style.background = `linear-gradient(90deg, #ff5d8f 0%, #ffd93d ${percent}%, #efe7fb ${percent}%, #efe7fb 100%)`;
    }

    function syncAge(changed, mark) {
      const minInput = document.getElementById("ageMin");
      const maxInput = document.getElementById("ageMax");
      let min = Number(minInput.value);
      let max = Number(maxInput.value);
      if (min > max) {
        if (changed === "min") {
          max = min;
          maxInput.value = String(max);
        } else {
          min = max;
          minInput.value = String(min);
        }
      }
      document.getElementById("ageReadout").textContent = `Ages ${min} to ${max}`;
      paintRange(minInput);
      paintRange(maxInput);
      if (mark) ageTouched = true;
    }

    function syncTravel(mark) {
      const input = document.getElementById("travelRange");
      const stop = TRAVEL_STOPS[Number(input.value)];
      document.getElementById("travelReadout").textContent = stop.label;
      input.setAttribute("aria-valuetext", stop.label);
      paintRange(input);
      if (mark) travelTouched = true;
    }

    function renderWish(block) {
      const wrap = document.createElement("section");
      wrap.className = "block";
      const title = document.createElement("h3");
      title.id = "label-perfect";
      title.textContent = block.title;
      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = block.hint;
      const input = document.createElement("textarea");
      input.id = "perfectNote";
      input.className = "wish";
      input.maxLength = 400;
      input.rows = 4;
      input.setAttribute("aria-labelledby", title.id);
      wrap.append(title, hint, input);
      return wrap;
    }

    function buildQuiz() {
      const root = document.getElementById("quizRoot");
      STEPS.forEach((stepData, index) => {
        const panel = document.createElement("div");
        panel.className = "step";
        panel.hidden = index !== 0;
        const title = document.createElement("h2");
        title.className = "step-title";
        title.tabIndex = -1;
        title.textContent = stepData.title;
        const lede = document.createElement("p");
        lede.className = "lede";
        lede.textContent = stepData.lede;
        panel.append(title, lede);
        stepData.blocks.forEach((block) => {
          if (block.kind === "age") panel.append(renderAge());
          else if (block.kind === "travel") panel.append(renderTravel());
          else if (block.kind === "wish") panel.append(renderWish(block));
          else panel.append(renderChoices(block));
        });
        root.append(panel);
      });
    }

    buildQuiz();
    refillDeck();

    function useRecipientPhotos(list) {
      if (!Array.isArray(list) || !list.length) return;
      recipientList = list.map((photo) => ({
        src: photo.src,
        focus: photo.focus || "center 30%"
      }));
      tiaDeck = [];
      tiaCursor = 0;
      lastTiaSrc = recipientList[0].src;
      tiaFailures = 0;
      paintTia(recipientList[0], false);
      startTiaRotation();
    }

    function readRoute() {
      const parts = location.pathname.split("/").filter(Boolean);
      if (parts[0] !== "f" || !parts[1]) return { account: "", slug: "" };
      if (parts[2]) {
        return {
          account: decodeURIComponent(parts[1]).toLowerCase(),
          slug: decodeURIComponent(parts[2]).toLowerCase()
        };
      }
      return { account: "", slug: decodeURIComponent(parts[1]).toLowerCase() };
    }

    const route = readRoute();
    forecastSlug = route.slug;
    let forecastAccount = route.account;
    if (!forecastSlug) location.replace("/");
    if (forecastSlug === "tia" && !forecastAccount) {
      recipientList = TIA_PHOTOS;
      TIA_PHOTOS.forEach((photo) => {
        const image = new Image();
        image.src = photo.src;
      });
      PHOTOS.forEach((photo) => {
        const image = new Image();
        image.src = photo.src;
      });
    }
    bindTiaPhoto();
    if (forecastSlug && forecastSlug !== "tia") applyBranding(forecastSlug.replace(/-/g, " "));

    if (forecastSlug) fetch(`/api/forecast?slug=${encodeURIComponent(forecastSlug)}&account=${encodeURIComponent(forecastAccount)}`)
      .then((response) => response.ok ? response.json() : null)
      .then((forecast) => {
        if (!forecast) return;
        applyBranding(forecast.recipientName);
        useRecipientPhotos(forecast.recipientPhotos);
      })
      .catch(() => {});
    syncAge("min", false);
    syncTravel(false);
    document.getElementById("ageMin").addEventListener("input", () => syncAge("min", true));
    document.getElementById("ageMax").addEventListener("input", () => syncAge("max", true));
    document.getElementById("travelRange").addEventListener("input", () => syncTravel(true));

    startBtn.addEventListener("click", () => {
      if (busy) return;
      showScreen("screen-quiz");
      showStep(stepIndex);
    });

    backBtn.addEventListener("click", () => {
      if (busy) return;
      if (stepIndex === 0) showScreen("screen-open");
      else showStep(stepIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      if (busy) return;
      if (stepIndex < STEPS.length - 1) showStep(stepIndex + 1);
      else runForecast("quiz");
    });

    againBtn.addEventListener("click", () => runForecast("again"));
    elseBtn.addEventListener("click", () => runForecast("else"));
    editBtn.addEventListener("click", () => {
      if (busy) return;
      showScreen("screen-quiz");
      showStep(0);
    });
  </script>
</body>
</html>
