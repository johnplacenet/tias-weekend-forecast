<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink: #2b2140; --coral: #ff5d73; --paper: #fff8f3; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Fredoka, "Avenir Next", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #ffe08a, #ff8fab 42%, #8d62e6);
    }
    form {
      width: min(420px, 100%);
      background: var(--paper);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 18px 40px rgba(43, 33, 64, 0.18);
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0 0 18px; }
    label { display: block; font-weight: 700; margin: 12px 0 6px; }
    input {
      width: 100%;
      border: 3px solid #ffe0ea;
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 1.05rem;
    }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 14px 16px;
      background: var(--coral);
      color: white;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: #b4234a; min-height: 1.2em; font-weight: 700; }
  </style>
</head>
<body>
  <form id="form">
    <h1>Sign in</h1>
    <p>This is the forecast studio. New accounts are added by an admin.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    if (location.pathname === "/signup") location.replace("/login");
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        error.textContent = data.error || "Try that sign-in again.";
        return;
      }
      location.href = params.get("next") || "/studio";
    });
  </script>
</body>
</html>
